<style>

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:70px;scroll-behavior:smooth}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;line-height:1.1;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1080px;margin:auto;padding:0 18px}

.bar{display:flex;align-items:center;gap:10px;height:58px}
.logo{font:800 22px 'Bricolage Grotesque',sans-serif;color:#fff;text-decoration:none;margin-right:auto}
.logo i{color:var(--sun);font-style:normal}
nav{display:none;gap:18px}nav a{color:#fff;text-decoration:none;font-weight:500;font-size:15px}

.lang{display:flex;border:1px solid #ffffff66;border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:5px 11px;font-size:13px;font-weight:700}
.lang button[aria-pressed=true]{background:var(--sun);color:#1C2420}
.cartbtn{background:var(--sun);color:#1C2420;border:0;border-radius:99px;padding:8px 14px;font-weight:700}
.hero{background:var(--g);color:#fff;padding:44px 0 56px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-90px;top:-90px;width:320px;height:320px;border-radius:50%;background:var(--sun);opacity:.95}
.hero .wrap{position:relative;z-index:1}
.hero h1{font-size:clamp(36px,8vw,68px);font-weight:800;max-width:11em}
.hero p{max-width:34em;font-size:18px;opacity:.92;margin:16px 0 24px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:700;text-decoration:none;display:inline-block;text-align:center}
.b1{background:var(--sun);color:#1C2420}.b2{background:#ffffff1f;color:#fff;border:1px solid #ffffff66}
.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:-26px;position:relative;z-index:2}
@media(min-width:760px){.trust{grid-template-columns:repeat(4,1fr)}}
.trust div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:500}
.trust b{display:block;color:var(--g)}
section{padding:46px 0}
h2{font-size:clamp(28px,5vw,40px);margin-bottom:6px}
.sub{color:var(--mut);margin:0 0 20px;max-width:40em}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px;font-weight:500}
.tabs button[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g)}
.subtabs button{font-size:14px;padding:5px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{height:130px;display:grid;place-items:center;font-size:54px;position:relative}
.ph small{position:absolute;bottom:6px;right:8px;font-size:10px;opacity:.55;font-family:'DM Sans'}
.cb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font-size:19px}.cb p{margin:0;color:var(--mut);font-size:14px;flex:1}
.price{font-weight:700;color:var(--g)}
.row{display:flex;gap:8px;margin-top:6px}
.add{flex:1;background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px;font-weight:700}
.wa{background:var(--wa);color:#fff;border:0;border-radius:10px;padding:10px 12px;font-weight:700;text-decoration:none;font-size:14px;display:inline-flex;align-items:center;gap:5px}
.pk{border-top:6px solid var(--sun)}
.pk ul{margin:0;padding-left:18px;color:var(--mut);font-size:14px;flex:1}
.who{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}.who span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:14px}
form.box,.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.fg{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.fg.two{grid-template-columns:1fr 1fr}}
label{font-size:14px;font-weight:500;display:grid;gap:4px}
input,select,textarea{font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.how{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.how div{border-left:4px solid var(--sun);padding:4px 14px}
footer{background:var(--g);color:#fff;padding:34px 0 90px}
footer a{color:var(--sun)}footer p{margin:6px 0;opacity:.9}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 4px 14px #0004}
.drawer{position:fixed;inset:0;z-index:40;display:none}
.drawer.open{display:block}
.shade{position:absolute;inset:0;background:#0009}
.panel{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--bg);padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));overflow:auto}
.panel h2{font-size:26px}
.line{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line span:first-child{flex:1}
.q{display:flex;align-items:center;gap:6px}.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.pay{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.pay label{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-weight:700;cursor:pointer;display:block}
.pay input{position:absolute;opacity:0;width:0}
.pay input:checked+span{color:#000}
.pay label:has(input:checked){border-color:var(--g);background:var(--card)}
.momo{border-top:5px solid #FFCB05}.airtel{border-top:5px solid #E40000}
.ok{background:#e7f6ec;color:#14532d;border-radius:10px;padding:12px;margin-top:12px;display:none}
.x{float:right;background:none;border:0;font-size:26px;color:var(--ink)}
.sec{font-size:13px;color:var(--mut);margin-top:10px}

{c:"drinks",s:"",n:{en:"Water 12-pack",rw:"Amazi 12"},d:{en:"For offices and gatherings.",rw:"Ku biro no mu birori."},p:7500,e:"🧊",bg:"#CFE5EE"}
];
let L="en",cat="meals",sub="lunch",cart={};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const fmt=n=>n.toLocaleString("en-US")+" RWF";
const wa=t=>`https://wa.me/${WA}?text=${encodeURIComponent(t)}`;
const tot=()=>Object.entries(cart).reduce((a,[i,q])=>a+ITEMS[i].p*q,0);
function render(){
 const t=T[L];document.documentElement.lang=L==="rw"?"rw":"en";
 $$("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
 $("#en").setAttribute("aria-pressed",L==="en");$("#rw").setAttribute("aria-pressed",L==="rw");
 $("#cats").innerHTML=Object.keys(t.cats).map(k=>`<button aria-pressed="${k===cat}" data-c="${k}">${t.cats[k]}</button>`).join("");
 $("#subs").style.display=cat==="meals"?"flex":"none";
 $("#subs").innerHTML=Object.keys(t.subs).map(k=>`<button aria-pressed="${k===sub}" data-s="${k}">${t.subs[k]}</button>`).join("");
 $("#items").innerHTML=ITEMS.map((x,i)=>({x,i})).filter(({x})=>x.c===cat&&(cat!=="meals"||x.s===sub)).map(({x,i})=>
 `<article class="card"><div class="ph" style="background:${x.bg}">${x.e}<small>${t.photo}</small></div><div class="cb"><h3>${x.n[L]}</h3><p>${x.d[L]}</p><div class="price">${fmt(x.p)}</div>
 <div class="row"><button class="add" data-a="${i}">${t.add}</button><a class="wa" target="_blank" rel="noopener" href="${wa("Hello L'escalette, I'd like to order: 1 x "+x.n.en+" ("+fmt(x.p)+")")}">💬 ${t.wa}</a></div></div></article>`).join("");
 $("#pkgs").innerHTML=t.pkgs.map((p,i)=>`<article class="card pk"><div class="cb"><div style="font-size:34px">${p.e}</div><h3>${p.n}</h3><div class="price">${p.pr}</div><ul>${p.i.map(s=>`<li>${s}</li>`).join("")}</ul>
 <div class="row"><button class="add" data-pk="${i}">${t.send_req}</button><a class="wa" target="_blank" rel="noopener" href="${wa("Hello L'escalette, I'm interested in the "+T.en.pkgs[i].n+" package.")}">💬</a></div></div></article>`).join("");
 const sel=$("#pkgSel"),cur=sel.selectedIndex;sel.innerHTML=t.pkgs.map(p=>`<option>${p.n}</option>`).join("");sel.selectedIndex=Math.max(cur,0);
 cartUI();
}
function cartUI(){
 const t=T[L],ids=Object.keys(cart);
 $("#cnt").textContent=Object.values(cart).reduce((a,b)=>a+b,0);
 $("#lines").innerHTML=ids.map(i=>`<div class="line"><span>${ITEMS[i].n[L]}<br><small>${fmt(ITEMS[i].p)}</small></span><span class="q"><button data-m="${i}" aria-label="-">−</button>${cart[i]}<button data-p="${i}" aria-label="+">+</button></span></div>`).join("");
 $("#empty").style.display=ids.length?"none":"block";$("#co").style.display=ids.length?"block":"none";
 $("#total").textContent=fmt(tot());
 const lines=ids.map(i=>`${cart[i]} x ${ITEMS[i].n.en}`).join(", ");
 $("#waCart").href=wa(`Hello L'escalette, I'd like to order: ${lines}. Total ${fmt(tot())}.`);
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.id==="en"||b.id==="rw"){L=b.id;render()}
 if(b.dataset.c){cat=b.dataset.c;render()}
 if(b.dataset.s){sub=b.dataset.s;render()}
 if(b.dataset.a){cart[b.dataset.a]=(cart[b.dataset.a]||0)+1;cartUI();$("#cnt").parentElement.animate([{transform:"scale(1.15)"},{transform:"scale(1)"}],200)}
 if(b.dataset.p){cart[b.dataset.p]++;cartUI()}
 if(b.dataset.m){if(--cart[b.dataset.m]<1)delete cart[b.dataset.m];cartUI()}
 if(b.dataset.pk){$("#pkgSel").selectedIndex=+b.dataset.pk;$("#bookForm").scrollIntoView({behavior:"smooth"})}
});
const open=v=>$("#drawer").classList.toggle("open",v);
$("#openCart").onclick=()=>open(true);$("#closeCart").onclick=()=>open(false);$("#shade").onclick=()=>open(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape")open(false)});
$("#payBtn").onclick=()=>{
 const t=T[L],n=$("#cn").value.trim(),p=$("#cp").value.replace(/\s/g,""),a=$("#ca").value.trim(),ok=$("#payOk");
 ok.style.display="block";ok.style.background="";
 if(!n||!a||!/^(07\d{8}|\+?2507\d{8})$/.test(p)){ok.style.background="#fde8e8";ok.style.color="#7f1d1d";ok.textContent=t.need;return}
 const m=document.querySelector("input[name=pm]:checked").value;
 ok.style.color="";ok.textContent=t.pay_ok(m,p,fmt(tot()));
 /* Production: POST order to your server, which calls the MTN MoMo / Airtel Money collection API. */
};
$("#bookForm").onsubmit=e=>{
 e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 const msg=`BOOKING REQUEST - L'escalette\nPackage: ${f.pkg}\nName: ${f.name} ${f.org?"("+f.org+")":""}\nPhone: ${f.phone}\nDate: ${f.date}\nGuests: ${f.guests}\nVenue: ${f.venue}\nNotes: ${f.notes}`;
 const o=$("#bookOk");o.style.display="block";o.textContent=T[L].req_ok;window.open(wa(msg),"_blank");
};
["#waFab","#waFoot"].forEach(s=>{$(s).href=wa("Hello L'escalette, I have a question.")});
render();
</script>
